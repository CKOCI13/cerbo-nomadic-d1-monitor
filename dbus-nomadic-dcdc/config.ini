; Nomadic D1 DC-DC converter monitor - settings
; Restart the monitor after editing:  svc -t /service/dbus-nomadic-dcdc
;
; This is a MONITOR ONLY: it listens to the converter and never sends it anything,
; so nothing here can change what the D1 does.

[can]
; CAN port the converter is wired to. auto = listen on every CAN port and use the one the
; converter is heard on (nothing is sent until then). Port names differ between Cerbo models
; (can0/can1, or vecan0/vecan1 on the Cerbo GX MK2), so leave this on auto unless you need to
; force a port. The bitrate is set by the GX CAN-bus port profile and must match the converter.
interface = auto
; Seconds without frames before the converter is shown as offline
timeout = 1.0

[dbus]
; How the converter shows up on the GX and in VRM:
;   alternator = as an alternator: its own tile on the Overview page (+ watts = charging the 48 V
;                battery, - watts = taking power from it for the 12 V side), and the GX's "DC loads"
;                figure stays right in both directions. Nothing is ever sent to the converter.
;   dcdc       = as a DC-DC converter in the device list (no Overview tile; the GX leaves it out of
;                its totals, so "DC loads" is off by the converter's power while it runs)
service_class = alternator
device_instance = 70
custom_name = DC-DC D1
; seconds between D-Bus updates
update_interval = 1.0
; yes = show the readings as cards in the GX switch pane, on the GX device page and in the
; VRM Switches panel / app widget (needs Venus OS v3.80 or newer)
switch_pane = yes
; Seconds over which voltage, current and power are averaged before the Cerbo shows them
; (Overview tile, DC loads, device page, switch pane, web page). The D1 reports current in whole
; amps, so a steady 36.4 A flips between 36 and 37 A: about 55 W on the 48 V side, which the GX's
; "DC loads" figure (alternator minus battery) shows as a jump from about -55 to +55 W.
; 0 = off (latest reading). History, kWh totals, records and temperature are never averaged.
smoothing = 5

[temperature]
; The D1's internal power-board temperature (D1 manual Rev D, section IV.B):
;   up to 105 C (221 F)  full output
;   105-120 C (221-248 F) the D1 cuts its current back, from 100 % down to 0 %
;   above 120 C (248 F)  the D1 stops and reports a fault
; The D1 says nothing before it derates, so the monitor warns earlier. Levels in degrees C
; (F = C x 1.8 + 32). Each clears 3 C (5 F) below where it came on. The Cerbo shows a
; "High Temperature" notification (service_class = alternator), the Alarm card in the switch
; pane names it, and the web page says Warning or Alarm.
warning = 100   ; 212 F: getting close to derating
alarm = 105     ; 221 F: derating has started
; yes = also show the D1 as a temperature sensor: a gauge on Levels > Environment, its own
; entry in the device list, a choice for the Brief page and for relay temperature control.
; Its type is "Water heater" (the only gauge scale, 32-212 F, that covers the D1's working
; range); you can change the type on the sensor's page.
sensor = yes
sensor_instance = 71

[web]
; Read-only web page with live values and charts: http://<gx-ip>:8088   (port = 0 disables it)
port = 8088
bind = 0.0.0.0
; Optional password for the web page (any user name). Empty = no password:
; anyone on your network can then see the readings (but not change anything).
password =
; Temperature unit on the web page. auto = the same as the Cerbo's own setting (Settings >
; General > Display & Appearance > Data units > Temperature), which the Cerbo screen and VRM
; already follow. fahrenheit or celsius = always that one.
temperature_unit = auto
