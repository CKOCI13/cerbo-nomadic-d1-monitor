; Nomadic D1 DC-DC converter monitor - settings
; Restart the monitor after editing:  svc -t /service/dbus-nomadic-dcdc
;
; This is a MONITOR ONLY: it listens to the converter and never sends it anything,
; so nothing here can change what the D1 does.

[can]
; SocketCAN interface of the GX port the converter is wired to (see README).
; The bitrate is set by the GX CAN-bus port profile and must match the converter.
interface = can1
; Seconds without frames before the converter is shown as offline
timeout = 1.0

[dbus]
; dcdc = show up as a DC-DC converter in the GX device list and VRM
service_class = dcdc
device_instance = 70
custom_name = DC-DC D1
; seconds between D-Bus updates
update_interval = 1.0
; yes = show the readings as cards in the GX switch pane, on the GX device page and in the
; VRM Switches panel / app widget (needs Venus OS v3.80 or newer)
switch_pane = yes

[web]
; Read-only web page with live values and charts: http://<gx-ip>:8088   (port = 0 disables it)
port = 8088
bind = 0.0.0.0
; Optional password for the web page (any user name). Empty = no password:
; anyone on your network can then see the readings (but not change anything).
password =
